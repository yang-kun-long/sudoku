name: Generate hell puzzle pool

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: Candidate puzzles to try
        required: false
        default: "1000"
      target_additions:
        description: Maximum accepted puzzles to append
        required: false
        default: "10"
  schedule:
    - cron: "17 18 * * 2"
    - cron: "17 18 * * 5"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate verified hell puzzles
        run: >
          npm run hell:generate --
          --attempts "${{ inputs.attempts || '1000' }}"
          --target-additions "${{ inputs.target_additions || '10' }}"
          --difficulty Extreme

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Commit updated pool
        run: |
          if git diff --quiet -- src/data/hell/verified.json; then
            echo "No new verified hell puzzles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hell/verified.json
          git commit -m "chore: update verified hell puzzle pool"
          git push
